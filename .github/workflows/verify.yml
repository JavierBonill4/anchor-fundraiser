# Solana Summer grader — Assignment 04, Fundraiser.
#
# SEALED. The submission checker compares this file's blob SHA against the
# upstream copy. Editing it fails your submission before anything is read.
#
# It runs in YOUR fork, on YOUR free Actions minutes. Nothing here uploads
# your source anywhere, and the site never executes it — it only reads the
# result this job publishes.
#
# This assignment is open-ended, so there is no canonical suite. grade.py
# checks four things instead: it builds, your tests are green and there are
# more of them, the IDL gained surface, and you declared an error.

name: verify

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Not cancel-in-progress: a run that is already
# going may be the one somebody is about to submit, and cancelling it makes
# that commit ungradeable until they dispatch it again by hand.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Grade forks, not the starter.
    #
    # The starter has no feature, by definition, so grading it would park a
    # permanent red X on the repository every student clones — which reads as
    # "the starter is broken" and generates support questions that have
    # nothing to do with anybody's code. Dispatch it by hand from the Actions
    # tab when you want to smoke-test the grader against the upstream.
    if: github.event.repository.fork || github.event_name == 'workflow_dispatch'

    env:
      CHALLENGE_ID: fundraiser-feature

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Deploying to a local validator needs a keypair. Runners have none.
      - name: Create a throwaway keypair
        run: solana-keygen new --no-bip39-passphrase -s -o "$HOME/.config/solana/id.json"

      # avm is deliberately NOT used.
      #
      # Two reasons. It compiles itself from source, which costs minutes to
      # install a version manager whose only job here is to fetch one binary.
      # And current avm verifies the downloaded binary's build provenance
      # through the GitHub attestations API, which answers 403 to a job
      # holding only `contents: read` — so `avm install` fails outright on a
      # hardened workflow. Take the release binary directly and check its
      # hash ourselves.
      #
      # On any failure the fallback is `cargo install anchor-cli`, which is
      # slow but has no provenance step and no avm.
      - name: Install Anchor 1.1.2
        env:
          ANCHOR_URL: https://github.com/solana-foundation/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu
          ANCHOR_SHA256: fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ok=0
          if curl -sSfL --retry 3 -o /tmp/anchor "$ANCHOR_URL"; then
            if echo "$ANCHOR_SHA256  /tmp/anchor" | sha256sum -c -; then
              install -m 0755 /tmp/anchor "$HOME/.local/bin/anchor"
              ok=1
            else
              echo "::warning::Anchor binary checksum did not match; building from source."
            fi
          else
            echo "::warning::Could not download the Anchor binary; building from source."
          fi
          if [ "$ok" = "0" ]; then
            cargo install anchor-cli --version 1.1.2 --locked --force
          fi
          anchor --version

      # Anchor 1.0 made surfpool — not solana-test-validator — the backend for
      # `anchor test`, and it is a separate install. Without it the test step
      # fails before a single test runs. Pinned so grading is reproducible; if
      # the pinned build is ever unreachable, grade.py falls back to the legacy
      # validator rather than failing the run.
      - name: Install surfpool
        env:
          SURFPOOL_URL: https://github.com/solana-foundation/surfpool/releases/download/v1.6.0/surfpool-linux-x64.tar.gz
          SURFPOOL_SHA256: cb471b00aa3b7d603338eb74ebfec1d23959ecba005b5f1be42ba8d174107fc2
        run: |
          mkdir -p "$HOME/.local/bin"
          if curl -sSfL --retry 3 -o /tmp/surfpool.tar.gz "$SURFPOOL_URL" \
            && echo "$SURFPOOL_SHA256  /tmp/surfpool.tar.gz" | sha256sum -c -; then
            tar xzf /tmp/surfpool.tar.gz -C "$HOME/.local/bin"
            chmod +x "$HOME/.local/bin/surfpool"
            "$HOME/.local/bin/surfpool" --version || true
          else
            echo "::warning::surfpool unavailable; grade.py will use --validator legacy."
          fi

      # cargo-build-sbf downloads the Solana platform-tools toolchain on its
      # first run — a few hundred megabytes that are identical every time.
      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ runner.os }}

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile || yarn install

      # grade.py owns `anchor keys sync`, `anchor build` and `anchor test`, so
      # a build failure still produces a result.json that says so rather than
      # a red run with nothing in it.
      - name: Grade
        run: python3 grader/grade.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-summer-result
          path: result.json
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          if [ -f result.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("result.json"))
          c = r["canonical"]
          print("## Solana Summer — " + r["challenge"])
          print()
          print(f"**Gates met:** {c['passed']}/{c['total']}")
          print()
          if r["notes"]:
              print("### Notes")
              for n in r["notes"]:
                  print(f"- {n}")
          PY
          fi
